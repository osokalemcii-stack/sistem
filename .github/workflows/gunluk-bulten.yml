
name: Gunluk 25 Lig Bulten Guncelleme

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bulten-cek:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: API-Football verilerini cek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python -m pip install --upgrade pip
          pip install requests
          python bulten_cek.py

      - name: Guncel bulten.json dosyasini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulten.json
          git diff --staged --quiet || git commit -m "chore: API-Football gunluk bulten guncellendi"
          git push
