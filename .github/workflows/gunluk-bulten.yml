
name: Gunluk 25 Lig Bulten Guncelleme

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bulten-cek:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: SportStatsAPI verilerini cek
        env:
          SPORTSTATS_API_KEY: ${{ secrets.SPORTSTATS_API_KEY }}
        run: |
          pip install requests
          python -u bulten_cek.py

      - name: Analiz motorunu calistir
        run: |
          python -u analiz_motoru.py

      - name: Bulten ve analiz dosyalarini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bulten.json bulten_history.json analiz.json
          git diff --staged --quiet || git commit -m "chore: bulten ve analiz guncellendi"
          git push
