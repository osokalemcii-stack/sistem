
name: Gunluk 25 Lig Bulten Guncelleme

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-bulten
  cancel-in-progress: false

jobs:
  bulten-cek:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gereken paketleri kur
        run: pip install requests

      - name: API-Football ile bulteni cek
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -u bulten_cek.py

      - name: Analiz motorunu calistir
        run: python -u analiz_motoru.py

      - name: JSON dosyalarini kontrol et
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ["bulten.json", "analiz.json"]:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"{name} bulunamadi")
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(name, "JSON kontrolu basarili")

          with open("bulten.json", encoding="utf-8") as f:
              matches = json.load(f)

          print("Bultendeki mac sayisi:", len(matches))

          if len(matches) == 0:
              raise SystemExit("Bulten bos, kaydetme durduruldu")
          PY

      - name: Bulten ve analiz dosyalarini kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bulten.json bulten_history.json analiz.json

          if git diff --staged --quiet; then
            echo "Dosyalarda degisiklik yok."
          else
            git commit -m "chore: API-Football gunluk bulten ve analiz"
            git push
          fi
