name: Gunluk 25 Lig Bulten Guncelleme
​on:
schedule:
- cron: "0 4 * * *"
- cron: "30 9 * * *"
workflow_dispatch: {}
​permissions:
contents: write
​jobs:
bulten-cek:
runs-on: ubuntu-latest
steps:
- name: Depoyu indir
uses: actions/checkout@v4
​- name: Python kur
uses: actions/setup-python@v5
with:
python-version: "3.11"
​- name: 25 ligi tarayip bulten.json olustur
run: python bulten_cek.py
​- name: Guncel bulten.json dosyasini kaydet
run: |
git config user.name "github-actions[bot]"
git config user.email "github-actions[bot]@users.noreply.github.com"
git add bulten.json
git diff --staged --quiet || git commit -m "chore: gunluk 25 lig bulteni guncellendi"
git push
