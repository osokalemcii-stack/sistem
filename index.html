
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>Tek / Çift Analiz Motoru</title>
<style>
:root {
  --bg:#090d18; --panel:#111827; --panel2:#182235;
  --line:#26334a; --text:#edf3ff; --muted:#91a0b8;
  --blue:#62a5ff; --green:#38d996; --red:#ff7185;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
header{
  padding:28px 18px 22px;
  background:linear-gradient(140deg,#14294b,#10182a 65%,#111827);
  border-bottom:1px solid var(--line);
}
.wrap{max-width:1050px;margin:auto}
.eyebrow{color:var(--blue);font-size:12px;font-weight:bold;letter-spacing:2px}
h1{font-size:27px;margin:9px 0}
.subtitle{color:var(--muted);font-size:13px}
main{max-width:1050px;margin:auto;padding:18px}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px
}
.stat,.filters,.match,.empty{
 background:var(--panel);border:1px solid var(--line);border-radius:14px
}
.stat{padding:14px}
.stat strong{display:block;font-size:23px;margin-bottom:5px}
.stat span{font-size:11px;color:var(--muted)}
.filters{padding:13px;margin-bottom:17px}
input,select{
 width:100%;padding:13px;border-radius:10px;
 border:1px solid var(--line);background:#0c1423;color:var(--text);
 font-size:14px;outline:none
}
.filtergrid{display:grid;grid-template-columns:2fr 1fr;gap:9px;margin-top:9px}
.section-title{font-size:15px;margin:20px 0 11px}
.match{padding:15px;margin-bottom:11px}
.matchtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.league{font-size:12px;color:var(--blue);font-weight:bold}
.date{font-size:11px;color:var(--muted)}
.teams{
 display:grid;grid-template-columns:1fr auto 1fr;gap:8px;
 align-items:center;margin:18px 0;text-align:center
}
.team{font-weight:bold;font-size:14px;overflow-wrap:anywhere}
.score{font-size:19px;font-weight:bold;white-space:nowrap}
.status{font-size:10px;color:var(--muted);margin-top:5px}
.pill{
 display:inline-block;padding:5px 9px;border-radius:20px;
 background:#1d2d46;color:#a9caff;font-size:10px
}
.details{
 border-top:1px solid var(--line);padding-top:11px;
 display:flex;justify-content:space-between;align-items:center;gap:8px
}
button{
 border:1px solid var(--line);background:var(--panel2);
 color:var(--text);padding:9px 12px;border-radius:9px;
 font-size:12px;cursor:pointer
}
.history{display:none;margin-top:12px;color:var(--muted);font-size:12px}
.history.open{display:block}
.history ul{padding-left:18px;line-height:1.9}
.empty{padding:25px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:30px 10px}
@media(max-width:520px){
 h1{font-size:23px}
 .stats{gap:7px}
 .stat{padding:11px}
 .stat strong{font-size:19px}
 .filtergrid{grid-template-columns:1fr}
 .team{font-size:12px}
}
</style>
</head>
<body>
<header>
 <div class="wrap">
  <div class="eyebrow">FOOTBALL DATA & ANALYTICS</div>
  <h1>TEK / ÇİFT ANALİZ MOTORU</h1>
  <div class="subtitle">25 lig • Maç arşivi • Takım ve hakem geçmişi</div>
 </div>
</header>

<main>
 <section class="stats">
  <div class="stat"><strong id="total">—</strong><span>TOPLAM MAÇ</span></div>
  <div class="stat"><strong id="finished">—</strong><span>TAMAMLANAN</span></div>
  <div class="stat"><strong id="upcoming">—</strong><span>GELECEK / DEVAM EDEN</span></div>
 </section>

 <section class="filters">
  <input id="search" placeholder="Takım veya lig ara...">
  <div class="filtergrid">
   <select id="league"><option value="">Tüm ligler</option></select>
   <select id="status">
    <option value="">Tüm maçlar</option>
    <option value="finished">Tamamlanan maçlar</option>
    <option value="upcoming">Gelecek / devam eden</option>
   </select>
  </div>
 </section>

 <div class="section-title" id="resultTitle">Maç bülteni</div>
 <section id="matches"><div class="empty">Bülten yükleniyor...</div></section>
</main>

<footer>
 Veriler SportStatsAPI üzerinden oluşturulan bülten dosyasından okunur.
 <br>TEK / ÇİFT ANALİZ MOTORU
</footer>

<script>
let allMatches = [];

function isFinished(m){
 const s = String(m.status || "").toLowerCase();
 return ["ft","aet","pen","finished","final","after extra time","after penalties"].includes(s);
}

function formatDate(value){
 if(!value) return "Tarih bilgisi yok";
 const d = new Date(value);
 if(Number.isNaN(d.getTime())) return value;
 return d.toLocaleString("tr-TR",{
  day:"2-digit",month:"2-digit",year:"numeric",
  hour:"2-digit",minute:"2-digit"
 });
}

function safe(value){
 return String(value ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function historyHtml(title,items){
 if(!Array.isArray(items) || !items.length)
  return `<p>${title}: Geçmiş maç verisi bulunamadı.</p>`;
 return `<b>${safe(title)}</b><ul>${items.slice(0,5).map(x=>{
  if(typeof x==="string") return `<li>${safe(x)}</li>`;
  return `<li>${safe(x.date || x.start_at || "")} — ${safe(x.home || x.home_team?.name || "")} ${safe(x.score || x.finalScore || "")} ${safe(x.away || x.away_team?.name || "")}</li>`;
 }).join("")}</ul>`;
}

function render(){
 const q=document.getElementById("search").value.toLocaleLowerCase("tr");
 const league=document.getElementById("league").value;
 const status=document.getElementById("status").value;

 const filtered=allMatches.filter(m=>{
  const text=[m.home,m.away,m.league,m.country].join(" ").toLocaleLowerCase("tr");
  if(q && !text.includes(q)) return false;
  if(league && m.league!==league) return false;
  if(status==="finished" && !isFinished(m)) return false;
  if(status==="upcoming" && isFinished(m)) return false;
  return true;
 });

 document.getElementById("resultTitle").textContent=
  `Maç bülteni · ${filtered.length} maç`;

 if(!filtered.length){
  document.getElementById("matches").innerHTML=
   `<div class="empty">Bu filtrelerle eşleşen maç bulunamadı.</div>`;
  return;
 }

 document.getElementById("matches").innerHTML=filtered.map((m,i)=>{
  const score=m.finalScore || "-";
  const finished=isFinished(m);
  const key=`history-${i}`;
  return `
   <article class="match">
    <div class="matchtop">
     <span class="league">${safe(m.country)} · ${safe(m.league)}</span>
     <span class="date">${safe(formatDate(m.date))}</span>
    </div>
    <div class="teams">
     <div class="team">${safe(m.home || "Ev sahibi")}</div>
     <div>
      <div class="score">${safe(score)}</div>
      <div class="status">${safe(m.status || "Programda")}</div>
     </div>
     <div class="team">${safe(m.away || "Deplasman")}</div>
    </div>
    <div class="details">
     <span class="pill">${finished?"TAMAMLANDI":"GELECEK / CANLI"}</span>
     <button onclick="toggleHistory('${key}')">Maç geçmişi +</button>
    </div>
    <div class="history" id="${key}">
     <p>Hakem: ${safe(m.referee || "Bilgi yok")}</p>
     ${historyHtml("Ev sahibi geçmişi",m.homeMatches)}
     ${historyHtml("Deplasman geçmişi",m.awayMatches)}
     ${historyHtml("Hakem geçmişi",m.refMatches)}
    </div>
   </article>`;
 }).join("");
}

function toggleHistory(id){
 const el=document.getElementById(id);
 if(el) el.classList.toggle("open");
}

async function loadBulletin(){
 try{
  const response=await fetch("./bulten.json?v="+Date.now());
  if(!response.ok) throw new Error("bulten.json yüklenemedi: "+response.status);
  const data=await response.json();
  if(!Array.isArray(data)) throw new Error("Bülten dosyasının formatı geçersiz.");

  allMatches=data;
  document.getElementById("total").textContent=data.length;
  document.getElementById("finished").textContent=data.filter(isFinished).length;
  document.getElementById("upcoming").textContent=data.filter(m=>!isFinished(m)).length;

  const leagues=[...new Set(data.map(m=>m.league).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"tr"));
  document.getElementById("league").innerHTML=
   '<option value="">Tüm ligler</option>'+
   leagues.map(x=>`<option value="${safe(x)}">${safe(x)}</option>`).join("");

  render();
 }catch(error){
  document.getElementById("matches").innerHTML=
   `<div class="empty">Bülten yüklenemedi.<br>${safe(error.message)}<br><br>Dosyanın index.html ile aynı klasörde olduğundan emin ol.</div>`;
  console.error(error);
 }
}

document.getElementById("search").addEventListener("input",render);
document.getElementById("league").addEventListener("change",render);
document.getElementById("status").addEventListener("change",render);
loadBulletin();
</script>
</body>
</html>
